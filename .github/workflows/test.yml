name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # engines is >=22. 22, 24, and 26 are the maintenance, active, and current Node.js release lines.
        # Local development uses .node-version (24), the same pin as node.js-template.
        node-version: [22.x, 24.x, 26.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Update this when Yarn no longer recommends Corepack
      # See: https://yarnpkg.com/getting-started/install
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn lint

      - name: Run tests
        run: yarn test

      - name: Build package
        run: yarn build

  # The published package is the tsup build. Import it the way an application would.
  package-test:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Update this when Yarn no longer recommends Corepack
      # See: https://yarnpkg.com/getting-started/install
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies and build
        run: |
          yarn install --immutable
          yarn build

      - name: Pack package
        run: |
          yarn pack
          echo "Package files created:"
          ls -la *.tgz

      - name: Test ESM import
        run: |
          # Create test dir in /tmp to avoid yarn workspace conflicts
          cd /tmp
          mkdir -p test-esm && cd test-esm

          # Create simple package.json
          cat > package.json << 'JSON'
          { "type": "module" }
          JSON
          npm init -y > /dev/null

          # Install the packed tarball - yarn pack always creates package.tgz
          npm install "${{ github.workspace }}/package.tgz"

          # Create test script
          cat > test.mjs << 'JS'
          import plugin from '@fulldecent/nice-checkers-plugin';
          console.log('✅ ESM import successful');
          console.log('Plugin name:', plugin.name);
          console.log('Plugin rules:', Object.keys(plugin.rules || {}));
          console.log('Plugin configs:', Object.keys(plugin.configs || {}));
          JS
          node test.mjs

      - name: Test CJS require
        run: |
          cd /tmp
          mkdir -p test-cjs && cd test-cjs

          npm init -y > /dev/null
          npm install "${{ github.workspace }}/package.tgz"

          cat > test.cjs << 'JS'
          const plugin = require('@fulldecent/nice-checkers-plugin');
          console.log('✅ CJS require successful');
          // CJS might require accessing the default export
          const actualPlugin = plugin.default || plugin;
          console.log('Plugin name:', actualPlugin.name);
          console.log('Plugin rules:', Object.keys(actualPlugin.rules || {}));
          console.log('Plugin configs:', Object.keys(actualPlugin.configs || {}));
          JS
          node test.cjs
