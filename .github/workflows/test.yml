name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # engines follows html-validate's floor. 22, 24, and 26 are the maintenance, active, and current Node.js release lines.
        # Local development uses .node-version (24), the same pin as node.js-template.
        node-version: [22.x, 24.x, 26.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Update this when Yarn no longer recommends Corepack
      # See: https://yarnpkg.com/getting-started/install
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn lint

      - name: Run tests
        run: yarn test

      - name: Build package
        run: yarn build

  # The published package is the tsdown build. Load it the way html-validate users do, from ESM and from CommonJS.
  package-test:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Update this when Yarn no longer recommends Corepack
      # See: https://yarnpkg.com/getting-started/install
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies and build
        run: |
          yarn install --immutable
          yarn build

      - name: Check package exports and types (publint, arethetypeswrong)
        run: yarn check:package

      - name: Pack package
        run: |
          yarn pack
          echo "Package files created:"
          ls -la *.tgz

      - name: Test ESM import
        run: |
          # Create test dir in /tmp to avoid yarn workspace conflicts
          mkdir -p /tmp/test-esm && cd /tmp/test-esm
          echo '{ "private": true, "type": "module" }' > package.json

          # yarn pack always creates package.tgz. npm installs the html-validate peer.
          npm install "${{ github.workspace }}/package.tgz"

          cat > test.mjs << 'JS'
          import assert from 'node:assert/strict'
          import { HtmlValidate, StaticConfigLoader } from 'html-validate'
          import NiceCheckersPlugin from '@fulldecent/nice-checkers-plugin'

          // Same configuration as the .htmlvalidate.mjs example in README.md
          const htmlvalidate = new HtmlValidate(
            new StaticConfigLoader({
              plugins: [NiceCheckersPlugin],
              extends: ['nice-checkers-plugin:recommended'],
            })
          )
          const report = await htmlvalidate.validateString('<script src="/jquery.js"></script>')
          const ruleIds = report.results[0].messages.map(message => message.ruleId)
          assert.ok(ruleIds.includes('nice-checkers/no-jquery'), ruleIds.join(', '))
          console.log('ESM import works with html-validate')
          JS
          node test.mjs

      - name: Test CJS require
        run: |
          mkdir -p /tmp/test-cjs && cd /tmp/test-cjs
          echo '{ "private": true }' > package.json
          npm install "${{ github.workspace }}/package.tgz"

          cat > test.cjs << 'JS'
          const assert = require('node:assert/strict')
          const { HtmlValidate, StaticConfigLoader, cjsResolver } = require('html-validate')

          // require() returns the plugin itself, not { default: plugin }
          const plugin = require('@fulldecent/nice-checkers-plugin')
          assert.equal(plugin.name, 'nice-checkers-plugin')

          // cjsResolver loads plugins by package name with require()
          const htmlvalidate = new HtmlValidate(
            new StaticConfigLoader([cjsResolver()], {
              plugins: ['@fulldecent/nice-checkers-plugin'],
              extends: ['nice-checkers-plugin:recommended'],
            })
          )
          htmlvalidate.validateString('<script src="/jquery.js"></script>').then(report => {
            const ruleIds = report.results[0].messages.map(message => message.ruleId)
            assert.ok(ruleIds.includes('nice-checkers/no-jquery'), ruleIds.join(', '))
            console.log('CJS require works with html-validate cjsResolver')
          })
          JS
          node test.cjs
